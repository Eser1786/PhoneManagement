services:
  mysql:
    image: mysql:8.4
    container_name: phonemanagement_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: phonemanagement_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

    restart: unless-stopped

volumes:
  mysql_data: